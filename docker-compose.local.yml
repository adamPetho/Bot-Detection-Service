services:
  botdetection:
    build:
      context: .
      dockerfile: Dockerfile.riskscorer
    image: botdetection:test
    container_name: botdetection
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped