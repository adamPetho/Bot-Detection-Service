<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registry Demo — Company</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<nav class="topbar">
  <span class="brand">Company Registry</span>
  <a href="index.html">Home</a>
  <a href="directory.html">Directory</a>
  <span class="spacer"></span>
  <a href="scenario-lab.html">Scenario Lab</a>
</nav>

<div class="container">
  <a href="directory.html">← Back to directory</a>
  <div id="detail"></div>
</div>

<script src="telemetry-collector.js"></script>
<script src="request-pattern-tracker.js"></script>
<script src="shared/companies.js"></script>
<script src="shared/demo-harness.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const company = (window.COMPANIES || []).find((c) => c.id === id);
  const detail = document.getElementById('detail');

  if (!company) {
    detail.innerHTML = `<h1>Unknown company</h1>
      <p class="lead">No company with id <code>${id ?? '(none)'}</code>.
      Go back to the <a href="directory.html">directory</a>.</p>`;
  } else {
    // Opening this page IS the page view — log it against the company id so a
    // later download counts as having a browsing trail.
    DemoHarness.logPageView(company.id);

    detail.innerHTML = `
      <h1>${company.name}</h1>
      <p class="lead">${company.sector} · ${company.city} · ${company.employees} employees</p>
      <div class="card">
        <h3>Registry document</h3>
        <div class="meta">Annual filing (PDF) · resource id ${company.id}</div>
        <p>In the real system this button would ask the backend for a
        short-lived signed URL, then download. Here it just logs the request
        against this company's id.</p>
        <button class="btn" id="downloadBtn">Download document</button>
        <span id="downloadMsg" class="meta" style="margin-left:10px;"></span>
      </div>
      <div class="note">
        You viewed this page before downloading — that's the browsing trail a
        real researcher leaves. Download a few companies this way and the
        detector sees a high browsing-trail ratio and healthy repeat/breadth
        balance. Compare that with the <a href="scenario-lab.html">Scenario
        Lab</a>, where downloads arrive with no page view at all.
      </div>`;

    document.getElementById('downloadBtn').addEventListener('click', () => {
      DemoHarness.logRequest(company.id);
      document.getElementById('downloadMsg').textContent =
        'Logged a document request for ' + company.id;
    });
  }
</script>
</body>
</html>
