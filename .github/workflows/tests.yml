name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Bot-Detection.Tests/Bot-Detection.Tests.csproj

      - name: Build
        run: dotnet build Bot-Detection.Tests/Bot-Detection.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Bot-Detection.Tests/Bot-Detection.Tests.csproj --configuration Release --no-build --verbosity normal